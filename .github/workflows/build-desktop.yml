name: Build Desktop

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.2-stable
  PROJECT_DIR: LinusTinyAdventure

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows
            preset: Windows Desktop
            out: dist/windows
            artifact: linus-tiny-adventure-windows
          - target: linux
            preset: Linux
            out: dist/linux
            artifact: linus-tiny-adventure-linux
          - target: macos
            preset: macOS
            out: dist/macos
            artifact: linus-tiny-adventure-macos
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot ${{ env.GODOT_VERSION }} (headless) + export templates
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}"
          curl -fsSL -o godot.zip      "${BASE}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          curl -fsSL -o templates.tpz  "${BASE}/Godot_v${GODOT_VERSION}_export_templates.tpz"

          unzip -q godot.zip
          sudo mv Godot_v${GODOT_VERSION}_linux.x86_64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot

          unzip -q templates.tpz
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.2.stable"
          mkdir -p "$TEMPLATE_DIR"
          mv templates/* "$TEMPLATE_DIR/"

      - name: Import project assets and build class cache
        working-directory: ${{ env.PROJECT_DIR }}
        # Godot 4.2 has no --import flag; opening the editor headless triggers
        # resource import and regenerates .godot/global_script_class_cache.cfg.
        run: |
          godot --headless --editor --quit-after 1000 || true
          godot --headless --editor --quit-after 1000 || true
          test -f .godot/global_script_class_cache.cfg

      - name: Export ${{ matrix.target }}
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          mkdir -p "${{ matrix.out }}"
          # Preset's export_path (in export_presets.cfg) is used when no path is given.
          godot --headless --export-release "${{ matrix.preset }}"
          ls -la "${{ matrix.out }}"
          # Fail the job if nothing landed in the output dir.
          test -n "$(ls -A '${{ matrix.out }}')"

      - name: Upload ${{ matrix.target }} artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ env.PROJECT_DIR }}/${{ matrix.out }}/
          if-no-files-found: error
